<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070d18" />
    <title>ORCA — Maritime Intelligence & Coastal Decision System</title>
    <meta
      name="description"
      content="Autonomous Agentic Maritime Intelligence Platform for India's Coastline — INCOIS, Copernicus, and Satellite Telemetry."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- The brand mark. Falls back to the emoji glyph if the artwork is not present, so a
         missing file costs a favicon rather than showing a broken-image tab icon. -->
    <link rel="icon" type="image/png" href="/orca-logo.png" />
    <link rel="alternate icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐋</text></svg>" />
    <link rel="apple-touch-icon" href="/orca-logo.png" />

    <script>
      // Applied BEFORE first paint. Deciding the theme in React instead would flash a
      // white screen on every load — the most visible possible polish failure, and the
      // first thing anyone notices on a projector.
      (function () {
        try {
          var stored = localStorage.getItem("orca-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* private browsing — fall through to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
